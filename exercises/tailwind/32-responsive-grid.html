<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 32: Responsive Product Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom skeleton animation — Tailwind doesn't have this built-in */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- ============================================
  INTRO: Responsive Design with Tailwind
  ============================================
  Tailwind uses a mobile-first approach:
    - Base class = mobile (no prefix)
    - sm: = 640px+
    - md: = 768px+
    - lg: = 1024px+
    - xl: = 1280px+
    - 2xl: = 1536px+

  So: grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4
  Means: 1 column → 2 columns at sm → 3 at lg → 4 at xl

  PATTERN: Responsive Design
  Think mobile-first: design for the smallest screen first,
  then add breakpoint classes to enhance larger screens.
  ============================================ -->

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
            <span class="text-white text-sm font-bold">S</span>
          </div>
          <h1 class="text-xl font-semibold text-gray-900">ShopGrid</h1>
        </div>

        <!-- Search — hidden on mobile, visible on md+ -->
        <div class="hidden md:flex items-center gap-2 flex-1 max-w-md mx-8">
          <div class="relative w-full">
            <input
              type="text"
              placeholder="Search products..."
              class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            />
            <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Cart button -->
          <button class="relative p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            <span id="cart-count" class="absolute -top-1 -right-1 w-4 h-4 bg-indigo-600 text-white text-xs rounded-full flex items-center justify-center hidden">0</span>
          </button>
        </div>
      </div>

      <!-- Mobile search — shown only on mobile -->
      <div class="mt-3 md:hidden">
        <input
          type="text"
          placeholder="Search products..."
          class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Filter bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">All Products</h2>
        <p class="text-sm text-gray-500 mt-0.5">
          <span id="product-count">12</span> products
        </p>
      </div>

      <div class="flex items-center gap-3 flex-wrap">
        <!-- Category filters -->
        <div class="flex items-center gap-2 flex-wrap">
          <button onclick="filterProducts('all')" data-filter="all"
            class="filter-btn px-3 py-1.5 text-sm rounded-full border font-medium transition-all active-filter bg-indigo-600 text-white border-indigo-600">
            All
          </button>
          <button onclick="filterProducts('electronics')" data-filter="electronics"
            class="filter-btn px-3 py-1.5 text-sm rounded-full border border-gray-300 text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition-all font-medium">
            Electronics
          </button>
          <button onclick="filterProducts('clothing')" data-filter="clothing"
            class="filter-btn px-3 py-1.5 text-sm rounded-full border border-gray-300 text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition-all font-medium">
            Clothing
          </button>
          <button onclick="filterProducts('books')" data-filter="books"
            class="filter-btn px-3 py-1.5 text-sm rounded-full border border-gray-300 text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition-all font-medium">
            Books
          </button>
        </div>

        <!-- Sort -->
        <select onchange="sortProducts(this.value)"
          class="text-sm border border-gray-300 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="default">Sort: Default</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </div>

    <!-- ============================================
    RESPONSIVE GRID: 1 → 2 → 3 → 4 columns
    grid-cols-1       = 1 column   (mobile, 0-639px)
    sm:grid-cols-2    = 2 columns  (small, 640px+)
    lg:grid-cols-3    = 3 columns  (large, 1024px+)
    xl:grid-cols-4    = 4 columns  (xl, 1280px+)
    ============================================ -->
    <div
      id="product-grid"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 lg:gap-6"
    >
      <!-- Products injected by JavaScript below -->
    </div>

    <!-- Empty state (shown when filter has no results) -->
    <div id="empty-state" class="hidden text-center py-16">
      <div class="text-5xl mb-4">🔍</div>
      <h3 class="text-lg font-medium text-gray-900 mb-2">No products found</h3>
      <p class="text-gray-500 mb-4">Try a different filter or category</p>
      <button onclick="filterProducts('all')" class="text-indigo-600 font-medium hover:underline">
        Show all products
      </button>
    </div>

  </main>

  <!-- ============================================
  DETAIL MODAL (Pre-built — study the structure)
  YOUR TURN: Make the hover effects work + open this modal on card click
  ============================================ -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" onclick="closeModal()"></div>

    <!-- Modal panel -->
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto relative">

        <!-- Close button -->
        <button onclick="closeModal()"
          class="absolute top-4 right-4 z-10 w-8 h-8 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center transition-colors">
          <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

        <!-- Modal content -->
        <div class="md:flex">
          <!-- Image -->
          <div class="md:w-1/2 bg-gray-100 rounded-t-2xl md:rounded-l-2xl md:rounded-tr-none overflow-hidden">
            <div id="modal-image" class="w-full h-64 md:h-full flex items-center justify-center text-8xl">🛍️</div>
          </div>

          <!-- Details -->
          <div class="md:w-1/2 p-6">
            <div class="flex items-start justify-between mb-2">
              <span id="modal-badge" class="text-xs font-medium px-2 py-1 rounded-full bg-indigo-100 text-indigo-700">Category</span>
              <div class="flex items-center gap-1">
                <span class="text-yellow-400">★</span>
                <span id="modal-rating" class="text-sm font-medium text-gray-700">0</span>
                <span id="modal-reviews" class="text-xs text-gray-400">(0)</span>
              </div>
            </div>

            <h2 id="modal-title" class="text-xl font-bold text-gray-900 mt-2 mb-2">Product Name</h2>
            <p id="modal-desc" class="text-gray-600 text-sm mb-4">Description goes here.</p>

            <div class="flex items-center gap-2 mb-6">
              <span id="modal-price" class="text-2xl font-bold text-gray-900">$0.00</span>
              <span id="modal-original" class="text-base text-gray-400 line-through hidden">$0.00</span>
              <span id="modal-discount" class="text-sm font-medium text-green-600 hidden">Save 0%</span>
            </div>

            <div class="flex gap-3">
              <button onclick="addToCart(currentModalProduct)"
                class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl transition-colors">
                Add to Cart
              </button>
              <button class="p-2.5 border border-gray-200 hover:border-red-300 hover:text-red-500 rounded-xl transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // Product Data
    // ============================================
    const products = [
      { id: 1, name: "Wireless Headphones Pro", price: 89.99, originalPrice: 129.99, category: "electronics", rating: 4.8, reviews: 2341, emoji: "🎧", desc: "Premium noise-cancelling wireless headphones with 30-hour battery life and studio-quality sound." },
      { id: 2, name: "Smart Watch Series 5", price: 249.99, originalPrice: null, category: "electronics", rating: 4.6, reviews: 892, emoji: "⌚", desc: "Advanced health tracking, GPS, always-on display, and 18-hour battery life." },
      { id: 3, name: "Mechanical Keyboard", price: 119.99, originalPrice: 149.99, category: "electronics", rating: 4.9, reviews: 456, emoji: "⌨️", desc: "Tactile Cherry MX switches, RGB backlighting, and an aluminum frame built to last." },
      { id: 4, name: "Dev Hoodie — Dark Mode", price: 54.99, originalPrice: null, category: "clothing", rating: 4.7, reviews: 1203, emoji: "👨‍💻", desc: "Ultra-soft cotton blend. Kangaroo pocket. Available in S-3XL. Perfect for long coding sessions." },
      { id: 5, name: "Minimalist Tote Bag", price: 39.99, originalPrice: 49.99, category: "clothing", rating: 4.5, reviews: 331, emoji: "👜", desc: "Canvas construction, laptop compartment, and a clean design for everyday carry." },
      { id: 6, name: "JavaScript: The Good Parts", price: 29.99, originalPrice: null, category: "books", rating: 4.4, reviews: 5621, emoji: "📖", desc: "Douglas Crockford's definitive guide to the beautiful parts of JavaScript." },
      { id: 7, name: "You Don't Know JS", price: 34.99, originalPrice: 44.99, category: "books", rating: 4.9, reviews: 3210, emoji: "📚", desc: "Kyle Simpson's deep-dive series into JavaScript internals. 6 volumes." },
      { id: 8, name: "USB-C Hub 7-in-1", price: 44.99, originalPrice: 59.99, category: "electronics", rating: 4.3, reviews: 789, emoji: "🔌", desc: "HDMI 4K, 3× USB-A 3.0, SD card reader, Gigabit Ethernet, and 100W PD charging." },
      { id: 9, name: "React T-Shirt", price: 24.99, originalPrice: null, category: "clothing", rating: 4.6, reviews: 567, emoji: "⚛️", desc: "Slim fit, 100% organic cotton. Show your love for React everywhere you go." },
      { id: 10, name: "Clean Code", price: 39.99, originalPrice: 49.99, category: "books", rating: 4.7, reviews: 8934, emoji: "✨", desc: "Robert C. Martin's essential guide to writing readable, maintainable code." },
      { id: 11, name: "Laptop Stand Adjustable", price: 69.99, originalPrice: null, category: "electronics", rating: 4.5, reviews: 1102, emoji: "💻", desc: "Ergonomic aluminum stand with 6 height settings. Folds flat for travel." },
      { id: 12, name: "Design Systems Book", price: 49.99, originalPrice: 64.99, category: "books", rating: 4.8, reviews: 2201, emoji: "🎨", desc: "Alla Kholmatova's definitive guide to building scalable design systems from scratch." },
    ];

    let currentFilter = 'all';
    let currentSort = 'default';
    let cartCount = 0;
    let currentModalProduct = null;

    // ============================================
    // Render Products
    // ============================================
    function renderProducts() {
      let filtered = currentFilter === 'all'
        ? [...products]
        : products.filter(p => p.category === currentFilter);

      // Sort
      if (currentSort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
      else if (currentSort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
      else if (currentSort === 'rating') filtered.sort((a, b) => b.rating - a.rating);

      const grid = document.getElementById('product-grid');
      const emptyState = document.getElementById('empty-state');
      document.getElementById('product-count').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = filtered.map(product => createProductCard(product)).join('');
    }

    // ============================================
    // Product Card Template
    // Tailwind classes used:
    //   group        — enables group-hover:* on children
    //   transition   — smooth all transitions
    //   hover:shadow-lg — shadow appears on hover
    //   overflow-hidden — clips image zoom
    // ============================================
    function createProductCard(product) {
      const discount = product.originalPrice
        ? Math.round((1 - product.price / product.originalPrice) * 100)
        : null;

      return `
        <div
          class="group bg-white rounded-2xl border border-gray-100 overflow-hidden hover:shadow-lg hover:-translate-y-1 transition-all duration-200 cursor-pointer"
          onclick="openModal(${product.id})"
        >
          <!-- Image area with overlay on hover -->
          <div class="relative overflow-hidden bg-gray-50 h-48">
            <div class="w-full h-full flex items-center justify-center text-6xl
                        group-hover:scale-110 transition-transform duration-300">
              ${product.emoji}
            </div>

            <!-- Quick-add button — slides up on hover -->
            <div class="absolute inset-x-0 bottom-0 p-3
                        translate-y-full group-hover:translate-y-0
                        transition-transform duration-200">
              <button
                onclick="event.stopPropagation(); addToCart(${product.id})"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 rounded-xl transition-colors"
              >
                + Add to Cart
              </button>
            </div>

            <!-- Discount badge -->
            ${discount ? `
              <div class="absolute top-3 left-3">
                <span class="bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">
                  -${discount}%
                </span>
              </div>
            ` : ''}

            <!-- Wishlist button -->
            <button
              onclick="event.stopPropagation()"
              class="absolute top-3 right-3 w-8 h-8 bg-white bg-opacity-80 hover:bg-opacity-100 rounded-full flex items-center justify-center shadow-sm hover:text-red-500 transition-all opacity-0 group-hover:opacity-100"
            >
              ♡
            </button>
          </div>

          <!-- Card body -->
          <div class="p-4">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-medium text-indigo-600 capitalize">${product.category}</span>
              <div class="flex items-center gap-1">
                <span class="text-yellow-400 text-xs">★</span>
                <span class="text-xs text-gray-600">${product.rating}</span>
                <span class="text-xs text-gray-400">(${product.reviews.toLocaleString()})</span>
              </div>
            </div>

            <h3 class="font-semibold text-gray-900 text-sm mb-2 line-clamp-2 group-hover:text-indigo-600 transition-colors">
              ${product.name}
            </h3>

            <div class="flex items-center gap-2">
              <span class="text-lg font-bold text-gray-900">$${product.price.toFixed(2)}</span>
              ${product.originalPrice ? `
                <span class="text-sm text-gray-400 line-through">$${product.originalPrice.toFixed(2)}</span>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // ============================================
    // Filter & Sort
    // ============================================
    function filterProducts(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const isActive = btn.dataset.filter === filter;
        btn.classList.toggle('bg-indigo-600', isActive);
        btn.classList.toggle('text-white', isActive);
        btn.classList.toggle('border-indigo-600', isActive);
        btn.classList.toggle('active-filter', isActive);
        btn.classList.toggle('border-gray-300', !isActive);
        btn.classList.toggle('text-gray-600', !isActive);
      });
      renderProducts();
    }

    function sortProducts(sort) {
      currentSort = sort;
      renderProducts();
    }

    // ============================================
    // Modal
    // ============================================
    function openModal(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;
      currentModalProduct = product;

      document.getElementById('modal-image').textContent = product.emoji;
      document.getElementById('modal-badge').textContent = product.category;
      document.getElementById('modal-title').textContent = product.name;
      document.getElementById('modal-desc').textContent = product.desc;
      document.getElementById('modal-price').textContent = `$${product.price.toFixed(2)}`;
      document.getElementById('modal-rating').textContent = product.rating;
      document.getElementById('modal-reviews').textContent = `(${product.reviews.toLocaleString()})`;

      if (product.originalPrice) {
        const discount = Math.round((1 - product.price / product.originalPrice) * 100);
        document.getElementById('modal-original').textContent = `$${product.originalPrice.toFixed(2)}`;
        document.getElementById('modal-original').classList.remove('hidden');
        document.getElementById('modal-discount').textContent = `Save ${discount}%`;
        document.getElementById('modal-discount').classList.remove('hidden');
      } else {
        document.getElementById('modal-original').classList.add('hidden');
        document.getElementById('modal-discount').classList.add('hidden');
      }

      document.getElementById('detail-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.body.style.overflow = '';
      currentModalProduct = null;
    }

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // ============================================
    // Cart
    // ============================================
    function addToCart(productOrId) {
      const product = typeof productOrId === 'object'
        ? productOrId
        : products.find(p => p.id === productOrId);
      if (!product) return;

      cartCount++;
      const countEl = document.getElementById('cart-count');
      countEl.textContent = cartCount;
      countEl.classList.remove('hidden');

      // Toast notification
      showToast(`${product.emoji} ${product.name} added to cart`);
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2.5 rounded-full text-sm font-medium shadow-lg z-[100] transition-all duration-300 opacity-0 translate-y-2';
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Initial render
    renderProducts();
  </script>

  -->

</body>
</html>
